        country:
          type: string
          description: ISO-3166-1 alpha-2 country code
        address:
          type: string
        nin:
          type: string
          description: |-
            The recipient's fødselsnummer, or a 9-digit organisasjonsnummer when the
             recipient is an organisation. Only required if the TFR config said so.
        exchange:
          type: string
        selfCustody:
          type: boolean
    ListBitcoinAccountsResponse:
      type: object
      properties:
        accounts:
          example:
            [
              {
                "id": "acc_01HQZX3V9KJ4M2P8R6T0W5Y7BC",
                "availableBtc": 0.0145,
                "totalBtc": 0.0151,
                "totalNok": 15824.8,
                "name": "Hovedkonto",
                "createTime": "2024-06-03T08:15:42.103948Z",
              },
              {
                "id": "acc_01J2M8RK4XHV7T3N9QW6B5Y0ZD",
                "availableBtc": 0.01,
                "totalBtc": 0.01,
                "totalNok": 10480,
                "name": "Sparekonto",
                "createTime": "2025-01-09T19:02:11.734120Z",
              },
            ]
          type: array
          items:
            $ref: "#/components/schemas/BitcoinAccount"
        totalBtc:
          example: 0.0251
          type: number
          description: The total BTC balance of all accounts.
          format: double
        totalNok:
          example: 26304.8
          type: number
          description: |-
            The total NOK value of the BTC of all accounts,
             at the time of the request.
          format: double
    ListTaxTransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
