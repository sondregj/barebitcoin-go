          type: string
          description: The status of the withdrawal.
          format: enum
        createdAt:
          example: "2026-03-14T09:26:53.589793Z"
          type: string
          description: The time the withdrawal was initiated.
          format: date-time
        sentAt:
          example: "2026-03-14T09:31:07.214552Z"
          type: string
          description: The time the withdrawal was sent from the platform.
          format: date-time
    GetFiatAccountResponse:
      type: object
      properties:
        availableNok:
          example: 12500.5
          type: number
          description: |-
            The current NOK holdings that can be used for trading or
