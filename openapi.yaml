    OpenOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    Order:
      type: object
      properties:
        orderId:
          example: "or_01J9ZK4T7M2QXW8B3N5R6V1Y0C"
          type: string
        type:
          example: "ORDER_TYPE_LIMIT"
          enum:
            - ORDER_TYPE_MARKET
            - ORDER_TYPE_LIMIT
          type: string
          format: enum
        direction:
          example: "DIRECTION_BUY"
          enum:
            - DIRECTION_BUY
            - DIRECTION_SELL
          type: string
          format: enum
        amount:
          example: 5000
          type: number
          format: double
        createdAt:
          example: "2026-03-14T09:26:53.589793Z"
          type: string
          format: date-time
    PriceResponse:
      type: object
      properties:
        price:
          example: 1048000
          type: number
          description: The mid price.
          format: double
        bid:
          example: 1046000
          type: number
          description: Current bid price, without fees.
          format: double
        ask:
          example: 1050000
          type: number
          description: Current ask price, without fees.
          format: double
        timestamp:
          example: "2026-03-14T09:26:53.589793Z"
          type: string
          description: The time the price was fetched.
          format: date-time
        card:
          example: { "buy": 1088850, "sell": 1007298 }
          allOf:
            - $ref: "#/components/schemas/UserPrice"
          description: Effective price, when paying with card.
        bank:
          example: { "buy": 1057350, "sell": 1038678 }
          allOf:
            - $ref: "#/components/schemas/UserPrice"
          description: Effective price, when paying with bank transfer.
    SendBitcoinRequest:
      type: object
      properties:
        destination:
          example: "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh"
          type: string
          description: |-
            The bitcoin destination to send funds to.
             Supported formats:
             - Bitcoin address (bech32, legacy-segwit, legacy)
             - Lightning invoice (bolt11)
             - Lightning address
             - Lightning LNURL
        amountBtc:
          example: 0.01
          type: number
          description: |-
            The amount to send.
             This field is required for all destinations except Lightning invoices.
             If the destination is a Lightning invoice, the amount is derived from the
             invoice.
          format: double
        accountId:
          example: "acc_01HQZX3V9KJ4M2P8R6T0W5Y7BC"
          type: string
          description: The ID of the account to send from. If empty, the default account is used.
        isPayment:
          example: false
          type: boolean
          description: |-
            Marks the transaction as a payment. This has consequences for how the
             transaction is exported for tax purposes. It has no effect on the
             bitcoin transaction itself.
        description:
          example: "Til hardware-lommebok"
          type: string
          description: |-
            Free-form text description of the withdrawal. Can be used to correlate with
             your own systems.
        tfrInfo:
          allOf:
            - $ref: "#/components/schemas/Info"
          description: |-
            The recipient of this transaction, per EU's travel rule. Required for all
             withdrawals to new destinations. full_name and address are always
             required, also when the recipient is an organisation.
    SendBitcoinResponse:
      type: object
      properties:
        withdrawalId:
          example: "wi_01JA2B3C4D5E6F7G8H9J0K1M2N"
          type: string
          description: The ID of the initiated withdrawal.
        network:
          example: "NETWORK_BITCOIN"
          enum:
            - NETWORK_BITCOIN
            - NETWORK_LIGHTNING
          type: string
          format: enum
        status:
          example: "WITHDRAWAL_STATUS_COMPLETED"
          enum:
            - WITHDRAWAL_STATUS_PENDING
            - WITHDRAWAL_STATUS_COMPLETED
            - WITHDRAWAL_STATUS_FAILED
          type: string
          description: |-
            The status of the withdrawal. The withdrawal might immediately succeed,
             if sending to another user of the Bare Bitcoin platform.
          format: enum
    TaxAccountBalance:
      type: object
      properties:
        id:
          example: "acc_01HQZX3V9KJ4M2P8R6T0W5Y7BC"
          type: string
        name:
          example: "Sparekonto"
          type: string
        balanceBtc:
          example: "1.89975850"
          type: string
          description: |-
            Stringified decimal number with 8 decimal places: the BTC balance of the
             account.
        deleteTime:
          example: "2025-11-14T09:03:11Z"
          type: string
          description: |-
            When this account was deleted. Empty if the account is not deleted. Only
             ever set when the request asked for deleted accounts.
          format: date-time
    TaxTransaction:
      type: object
      properties:
        id:
          example: "tr_01HVXHG9PMDKR3YQV4Z8W5T2BN"
          type: string
          description: |-
            ID of the underlying transaction; its format depends on the type. Trades
             use the trade ID (tr_), bitcoin deposits de_, bonuses gb_, fiat withdrawals
             fpu_ and adjustments abj_ or apj_. Bitcoin withdrawals and card deposits use
             a UUID, which is not the withdrawal_id returned by the transfer endpoints.
             Bank deposits use the bank's reference.
        accountId:
          example: "acc_01HQZX3V9KJ4M2P8R6T0W5Y7BC"
          type: string
          description: |-
            The bitcoin account the transaction belongs to. Empty for fiat deposits
             and fiat withdrawals, which are not tied to an account.
        type:
          enum:
            - TAX_TRANSACTION_TYPE_BTC_BUY
            - TAX_TRANSACTION_TYPE_BTC_SELL
            - TAX_TRANSACTION_TYPE_BTC_WITHDRAWAL
            - TAX_TRANSACTION_TYPE_BTC_DEPOSIT
            - TAX_TRANSACTION_TYPE_BTC_BONUS
            - TAX_TRANSACTION_TYPE_FIAT_DEPOSIT
            - TAX_TRANSACTION_TYPE_FIAT_WITHDRAWAL
            - TAX_TRANSACTION_TYPE_BTC_ADJUSTMENT
            - TAX_TRANSACTION_TYPE_FIAT_ADJUSTMENT
          type: string
          format: enum
        subType:
          example: "market"
          enum:
            - ""
            - "market"
            - "limit"
            - "manual"
            - "onchain"
            - "lightning"
            - "internal"
            - "internal-external"
            - "lightning-payment-request"
            - "lightning-address"
            - "lightning-lnurl"
            - "bank"
            - "card"
            - "write_off"
            - "correction"
            - "unspecified"
          type: string
          description: |-
            Sub-type of the transaction. Which values apply depends on the type:
             trades carry the order type, bitcoin transfers the network, fiat deposits
             the payment method and adjustments the reason. Empty when the transaction
             has no sub-type.
        createTime:
          example: "2024-02-01T10:22:36Z"
          type: string
          format: date-time
        finalizeTime:
          example: "2024-02-01T10:41:05Z"
          type: string
          description: |-
            Unset while the transaction is still pending, e.g. a bitcoin deposit
             that is not yet confirmed.
          format: date-time
        inAmount:
          example: "0.1"
          type: string
          description: Stringified decimal number
        inCurrency:
          example: "BTC"
          type: string
        outAmount:
          example: "65000"
          type: string
          description: |-
            Stringified decimal number. Includes trade fees; withdrawal fees are
             additional.
        outCurrency:
          example: "NOK"
          type: string
        feeAmount:
          example: "455"
          type: string
          description: |-
            Stringified decimal number. When the fee is zero, fee_currency may be
             empty.
        feeCurrency:
          example: "NOK"
          type: string
        rateMarket:
          example: "645450"
          type: string
          description: |-
            Stringified decimal number: the market rate in NOK per BTC at the time of
             the transaction.
        isPayment:
          example: false
          type: boolean
          description: |-
            Whether the transaction was a payment to a third party, as declared by
             the user. Only ever set for bitcoin withdrawals.
        paymentInfo:
          example: "f4184fc596403b9d638783cf57adfe4c75c605f6356fbc91338530e9831e9e16:bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4"
          type: string
          description: |-
            For bitcoin transfers: `<network ID>:<destination address>`. For bank
             fiat transfers: the counterparty bank account number. Empty for card
             deposits, trades and bonuses.
        note:
          example: "Første kjøp"
          type: string
          description: Free-form user-supplied description.
        usdnok:
          example: "10.45"
          type: string
          description: |-
            Stringified decimal number: the USD/NOK exchange rate at the time of the
             transaction, when known.
        runningBalanceBtc:
          example: "1.8997585"
          type: string
          description: |-
            Stringified decimal number: the user's total BTC balance across all
             accounts after this transaction.
    UserPrice:
      type: object
      properties:
        buy:
          example: 1057350
          type: number
          format: double
        sell:
          example: 1038678
          type: number
          format: double
      description: |-
        The prices a user can expect to pay for a given amount of BTCNOK,
         with a given payment method.
    VolumeHistoricResponse:
      type: object
      properties:
        dailyVolume:
          type: array
          items:
            $ref: "#/components/schemas/VolumeHistoricResponse_DailyVolume"
        shareOfTotalVolume:
          example: { "Bare Bitcoin": 0.41, "Firi": 0.38, "NBX": 0.21 }
          type: object
          additionalProperties:
            type: number
            format: double
          description: Each market's share of the total volume for the period in question.
    VolumeHistoricResponse_DailyVolume:
      type: object
      properties:
        date:
          example: "2026-03-14"
          type: string
          description: YYYY-MM-DD
        stats:
          example:
            {
              "Bare Bitcoin":
                {
                  "name": "Bare Bitcoin",
                  "color": "#FF8000",
                  "volumeNok": 4823117,
                  "volumeBtc": 4.61234567,
                  "shareOfTotalVolume": 0.41,
                },
              "Firi":
                {
                  "name": "Firi",
                  "color": "#3538D4",
                  "volumeNok": 4471342,
                  "volumeBtc": 4.27566219,
                  "shareOfTotalVolume": 0.38,
                },
              "NBX":
                {
                  "name": "NBX",
                  "color": "#BEED5E",
                  "volumeNok": 2470411,
                  "volumeBtc": 2.36295,
                  "shareOfTotalVolume": 0.21,
                },
            }
          type: object
          additionalProperties:
            $ref: "#/components/schemas/VolumeHistoricResponse_MarketStats"
          description: Each market's volume for the day.
    VolumeHistoricResponse_MarketStats:
      type: object
      properties:
        name:
          example: "Bare Bitcoin"
          type: string
        color:
          example: "#FF8000"
          type: string
        volumeNok:
          example: 4823117
          type: number
          format: double
        volumeBtc:
          example: 4.61234567
          type: number
          format: double
        shareOfTotalVolume:
          example: 0.41
          type: number
          description: Share of the total volume for the day in question.
          format: double
    VolumeResponse:
      type: object
      properties:
        daily:
          example:
            {
              "amountNok": 4823117,
              "amountBtc": 4.61234567,
              "buyPercentage": 63,
              "numberOfTrades": 412,
            }
          allOf:
            - $ref: "#/components/schemas/VolumeStats"
          description: Volume for the requested date, in Oslo time.
        monthly:
          example:
            {
              "amountNok": 98234511,
              "amountBtc": 93.81234567,
              "buyPercentage": 58,
              "numberOfTrades": 8731,
            }
          allOf:
            - $ref: "#/components/schemas/VolumeStats"
          description: Volume for the calendar month containing the requested date.
        yearly:
          example:
            {
              "amountNok": 412345678,
              "amountBtc": 402.12345678,
              "buyPercentage": 61,
              "numberOfTrades": 37104,
            }
          allOf:
            - $ref: "#/components/schemas/VolumeStats"
          description: Volume for the calendar year containing the requested date.
        last24h:
          example:
            {
              "amountNok": 5102334,
              "amountBtc": 4.87654321,
              "buyPercentage": 64,
              "numberOfTrades": 437,
            }
          allOf:
            - $ref: "#/components/schemas/VolumeStats"
          description: Volume for the last 24 hours, regardless of the requested date.
    VolumeStats:
      type: object
      properties:
        amountNok:
          example: 4823117
          type: number
          format: double
        amountBtc:
          example: 4.61234567
          type: number
          format: double
        buyPercentage:
          example: 63
          type: number
          format: double
        numberOfTrades:
          example: 412
          type: integer
          format: int32
  securitySchemes:
    apiKey:
      type: apiKey
      description: Public part of your API key. Starts with `bb/public/`.
      name: x-bb-api-key
      in: header
    apiNonce:
      type: apiKey
      description: Nonce value. Used to ensure correct ordering of all API requests, as well as prevent attackers from being able to replay old requests. Can be set to any value, but needs to increase for each request. Recommendation is to use the current Unix timestamp in milliseconds.
      name: x-bb-api-nonce
      in: header
    apiHmac:
      type: apiKey
      description: HMAC authentication for the API request, constructed using the corresponding secret value from your API key.
      name: x-bb-api-hmac
      in: header
    oauth2:
      type: oauth2
      description: OAuth2 access token obtained through the authorization code flow. Only available on a subset of endpoints. The required scope is listed per operation.
      flows:
        authorizationCode:
          authorizationUrl: https://api.bb.no/oauth2/v0/authorize
          tokenUrl: https://api.bb.no/oauth2/v0/token
          refreshUrl: https://api.bb.no/oauth2/v0/token
          scopes:
            "api:accounts:bitcoin:read": "See balance and names of your bitcoin accounts"
            "api:trades:read": "See executed trades"
            "api:tax:transactions:read": "Read transactions relevant for tax calculation"
            "api:deposits:lightning:read": "See Lightning invoices and their payment status"
            "api:deposits:lightning:write": "Create Lightning invoices for payments to you"
security:
  - apiKey: []
tags:
  - name: BitcoinTransferService
    description: |-
      Transfer bitcoin in and out of the platform. Fetch information about past
       bitcoin transfers.
  - name: PublicService
    description: Public endpoints that don't require authentication
  - name: TaxService
  - name: TradingService
    description: Execute and cancel orders. Fetch information about past orders.
  - name: UserService
    description: Fetch information the authenticated user and its bitcoin accounts.
