             show it to the payer.
        internalDescription:
          example: "faktura-1042"
          type: string
          description: |-
            Free-form text description of the invoice. Can be used to correlate with
             your own systems. Only shown to the creator of this invoice, within the
             Bare Bitcoin systems.
    NewLightningInvoiceResponse:
      type: object
      properties:
        depositDestinationId:
          example: "ded_01JA3QW7E2R9T4Y6V8P0S1D3F5"
          type: string
        invoice:
          example: "lnbc2500u1pvjluezsp5zyg3zyg3zyg3zyg3zyg3zyg3zyg3zyg3zyg3zyg3zyg3zyg3zygspp5qqqsyqcyq5rqwzqfqqqsyqcyq5rqwzqfqqqsyqcyq5rqwzqfqypqdq5xysxxatsyp3k7enxv4jsxqzpu9qrsgquk0rl77nj30yxdy8j9vdx85fkpmdla2087ne0xh8nhedh8w27kyke0lp53ut353s06fv3qfegext0eh0ymjpf39tuven09sam30g4vgpfna3rh"
          type: string
    NewOrderRequest:
      type: object
      properties:
        type:
          example: "ORDER_TYPE_MARKET"
          enum:
            - ORDER_TYPE_MARKET
            - ORDER_TYPE_LIMIT
          type: string
          format: enum
        direction:
          example: "DIRECTION_BUY"
          enum:
            - DIRECTION_BUY
            - DIRECTION_SELL
          type: string
          format: enum
        amount:
          example: 5000
          type: number
          description: |-
            Amount to spend. Must be positive. When buying, this is the amount in NOK.
             When selling, this is the amount in BTC.
          format: double
        accountId:
          example: "acc_01HQZX3V9KJ4M2P8R6T0W5Y7BC"
          type: string
          description: The bitcoin account to use for this order. Empty for default account.
        description:
          example: "Månedlig sparing"
          type: string
          description: |-
            Free-form text description of the order. Can be used to correlate with
             your own systems.
        price:
          example: 1040000
          type: number
          description: The price to buy or sell at. Only used for limit orders.
          format: double
    NewOrderResponse:
      type: object
      properties:
        orderId:
          example: "or_01J9ZK4T7M2QXW8B3N5R6V1Y0C"
          type: string
          description: ID of the created order.
        tradeId:
          example: "tr_01J9ZK4T7S8P2D6F4H0K3M5N7Q"
          type: string
          description: |-
            If this was a market order, the order resulted in a trade. Empty if not
