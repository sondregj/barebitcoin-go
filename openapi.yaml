# Generated with protoc-gen-openapi
# https://github.com/google/gnostic/tree/master/cmd/protoc-gen-openapi

openapi: 3.0.3
info:
  title: Bare Bitcoin API
  description: API for interacting with Bare Bitcoin. Most endpoints require authentication. Create API keys [here](https://barebitcoin.no/innlogget/profil/nokler). Read about API authentication [here](https://barebitcoin.no/developers/authentication).
  contact:
    url: https://barebitcoin.no
    email: barebitcoin@bb.no
  version: 0.0.1
servers:
  - url: https://api.bb.no
    description: Prod environment
paths:
  /v1/deposit-destinations/bitcoin:
    get:
      tags:
        - BitcoinTransferService
      summary: Fetch bitcoin deposit destinations
      description: |-
        Fetches bitcoin deposit destinations. These destinations are always valid,
         and can be used for receiving arbitrary amounts. Onchain addresses are refreshed
         every time a deposit is made, but all prior generated addresses are still valid.
      operationId: BitcoinTransferService_DepositDestinations
      parameters:
        - name: accountId
          in: query
          description: If empty, the default account is used.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositDestinationsResponse"
  /v1/deposit-destinations/bitcoin/invoice:
    post:
      tags:
        - BitcoinTransferService
      summary: Create a new Lightning invoice
      description: |-
        Creates a new BOLT11 Lightning invoice. Lightning invoices are requests to receive a specific
         amount of bitcoin within a set amount of time. If you don't need a specific amount, consider
         using the destinations returned from /v1/deposit-destinations/bitcoin.
      operationId: BitcoinTransferService_NewLightningInvoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLightningInvoiceRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewLightningInvoiceResponse"
      security:
        - apiKey: []
        - oauth2:
            - api:deposits:lightning:write
  /v1/deposit-destinations/bitcoin/invoice/{id}:
    get:
      tags:
        - BitcoinTransferService
      summary: Fetch a Lightning invoice
      description: Fetches a Lightning invoice.
      operationId: BitcoinTransferService_GetLightningInvoice
      parameters:
        - name: id
          in: path
          description: |-
            Can be:
             1. Deposit destination ID. Prefix: `ded_`.
             2. The Lightning invoice itself.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLightningInvoiceResponse"
      security:
        - apiKey: []
        - oauth2:
            - api:deposits:lightning:read
  /v1/orders:
    get:
      tags:
        - TradingService
      summary: Fetch open orders
      description: |-
        Fetches all open orders for the user. Open orders are orders that are
         not yet filled, and can be cancelled.
      operationId: TradingService_OpenOrders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenOrdersResponse"
    post:
      tags:
        - TradingService
      summary: Place a new order
      description: |-
        Places a new order. If the endpoint returns with a 200 status, the order
         is successfully placed. If you're creating a market order, a trade is
         also created, and its ID is included in the response. Requests are not
         idempotent: after a timeout, check open orders before retrying.
      operationId: TradingService_NewOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrderRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewOrderResponse"
      security:
        - apiKey: []
          apiHmac: []
          apiNonce: []
  /v1/orders/{orderId}:
    delete:
      tags:
        - TradingService
      summary: Cancel an order
      description: |-
        Cancel a pending order. If the order is already filled, an error will
         be returned. It is not possible to cancel market orders.
      operationId: TradingService_CancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
      security:
        - apiKey: []
          apiHmac: []
          apiNonce: []
  /v1/price/nok:
    get:
      tags:
        - PublicService
      summary: Fetch BTCNOK
      description: Fetches the current BTCNOK price.
      operationId: PublicService_Price
      parameters:
        - name: amount
          in: query
          description: Amount NOK to trade for. If empty, defaults to 5000 NOK.
          schema:
            type: number
            format: double
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResponse"
      security:
        - {}
  /v1/tax/balance:
    get:
      tags:
        - TaxService
      summary: Fetch balances
      description: |-
        Fetches the user's current balances: the NOK balance, and the balance of
         each bitcoin account.
      operationId: TaxService_GetTaxBalance
      parameters:
        - name: includeDeleted
          in: query
          description: |-
            Include accounts that have previously been deleted. Useful for resolving
             the name of an account referenced by an older transaction.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTaxBalanceResponse"
      security:
        - apiKey: []
        - oauth2:
            - api:accounts:bitcoin:read
  /v1/tax/transactions:
    get:
      tags:
        - TaxService
      summary: List tax transactions
      description: |-
        Lists tax-relevant transactions done by the user within the Bare Bitcoin platform.
         Note that this does NOT include any of the third party transactions imported into
         the platform tax calculator.
      operationId: TaxService_ListTaxTransactions
      parameters:
        - name: pageSize
          in: query
          description: Items per page (max 200). When set to 0, all matching transactions are returned.
          schema:
            type: integer
            format: int32
        - name: after
          in: query
          description: |-
            Transactions are listed oldest first (required to compute running_balance_btc
             correctly), so pagination walks forward in time. Only return transactions
             created after this time. Can be used standalone to filter down to a start
             date; pass next_after from the previous response (together with
             next_after_id) to fetch the next page.
          schema:
            type: string
            format: date-time
        - name: afterId
          in: query
          description: |-
            Pagination cursor tiebreaker: when multiple transactions share the same
             create_time, this ID breaks the tie. Pass next_after_id from the previous
             response. Requires 'after'; supplying 'after_id' alone is rejected.
          schema:
            type: string
        - name: before
          in: query
          description: |-
            Only return transactions created strictly before this time. Filter only,
             does not affect pagination direction.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTaxTransactionsResponse"
      security:
        - apiKey: []
        - oauth2:
            - api:tax:transactions:read
  /v1/user/applications/consent/{clientId}:
    delete:
      tags:
        - UserService
      summary: Revoke consent for a specific OAuth2 application
      description: Revokes the access you have given the OAuth2 application with this client ID.
      operationId: UserService_RevokeConsent
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content: {}
      security:
        - apiKey: []
        - oauth2: []
  /v1/user/bitcoin-accounts:
    get:
      tags:
        - UserService
      summary: Fetch bitcoin accounts
      description: |-
        Lists the bitcoin accounts for the user. Each bitcoin account has a
         separate balance. Every bitcoin transaction (withdrawal, deposit, trade,
         bonus payout) affects the balance of exactly one bitcoin account.
      operationId: UserService_ListBitcoinAccounts
      parameters:
        - name: includeDeleted
          in: query
          description: Include accounts that have previously been deleted.
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBitcoinAccountsResponse"
      security:
        - apiKey: []
        - oauth2:
            - api:accounts:bitcoin:read
  /v1/user/fiat-account:
    get:
      tags:
        - UserService
      summary: Fetch user fiat information
      description: |-
        Fetches the fiat account. The fiat account for a user holds their NOK
         balance. Every user has exactly one fiat account. Other sub-accounts for a user
         only pertains to bitcoin holdings.
      operationId: UserService_GetFiatAccount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFiatAccountResponse"
  /v1/volume:
    get:
      tags:
        - PublicService
      summary: Fetch volume statistics
      description: Returns statistics about the volume of BTCNOK trades.
      operationId: PublicService_Volume
      parameters:
        - name: date
          in: query
          description: |-
            The date to fetch the volume for. If empty, defaults to today.
             Format: YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeResponse"
      security:
        - {}
  /v1/volume/historic:
    get:
      tags:
        - PublicService
      summary: Fetch historic volume statistics
      operationId: PublicService_VolumeHistoric
      parameters:
        - name: date
          in: query
          description: |-
            First day of the period to fetch volume for. The period runs until today.
             If empty, defaults to one month ago. Format: YYYY-MM-DD
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeHistoricResponse"
      security:
        - {}
  /v1/withdrawals/bitcoin:
    post:
      tags:
        - BitcoinTransferService
      summary: Initiate withdrawal
      description: |-
        Initiates a bitcoin withdrawal. The transaction is not completed until
         it is confirmed by the network it is sent onto. A success response from
         this endpoint means the transaction was successfully initiated, but
         does not guarantee completion. Requests are not idempotent: after a
         timeout, check your withdrawals before retrying.
      operationId: BitcoinTransferService_SendBitcoin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBitcoinRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendBitcoinResponse"
      security:
        - apiKey: []
          apiHmac: []
          apiNonce: []
  /v1/withdrawals/bitcoin/{withdrawalId}:
    get:
      tags:
        - BitcoinTransferService
      summary: Fetch withdrawal
      description: Fetches a bitcoin withdrawal.
      operationId: BitcoinTransferService_GetBitcoinWithdrawal
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBitcoinWithdrawalResponse"
components:
  schemas:
    BitcoinAccount:
      type: object
      properties:
        id:
          example: "acc_01HQZX3V9KJ4M2P8R6T0W5Y7BC"
          type: string
        availableBtc:
          example: 0.0245
          type: number
          description: The current BTC holdings that can be used for trading or withdrawals.
          format: double
        totalBtc:
          example: 0.0251
          type: number
          description: The BTC balance of the account.
          format: double
        totalNok:
          example: 26304.8
          type: number
          description: The NOK value of the BTC of the account, at the time of the request.
          format: double
        name:
          example: "Hovedkonto"
          type: string
          description: The name of the account.
        createTime:
          example: "2024-06-03T08:15:42.103948Z"
          type: string
          description: When this account was created.
          format: date-time
        deleteTime:
          example: "2025-11-14T09:03:11.482190Z"
          type: string
          description: |-
            When this account was deleted.
             Empty if the account is not deleted.
          format: date-time
    DepositDestination:
      type: object
      properties:
        destination:
          example: "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh"
          type: string
        network:
          example: "NETWORK_BITCOIN"
          enum:
            - NETWORK_BITCOIN
            - NETWORK_LIGHTNING
          type: string
          format: enum
    DepositDestinationsResponse:
      type: object
      properties:
        onchainAddress:
          example:
            {
              "destination": "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh",
              "network": "NETWORK_BITCOIN",
            }
          allOf:
            - $ref: "#/components/schemas/DepositDestination"
          description: Bitcoin address for on-chain deposits to the account.
        lightningAddress:
          example:
            {
              "destination": "aktiv-anker@bb.no",
              "network": "NETWORK_LIGHTNING",
            }
          allOf:
            - $ref: "#/components/schemas/DepositDestination"
          description: |-
            Lightning address (name@bb.no) that accepts payments of any amount to the
             account.
        lnurlPay:
          example:
            {
              "destination": "LNURL1DP68GURN8GHJ7CTSDYHXYC3WDEHJ7MRFVA58GMNFDENJ7MRWW4EXCTTSV9UN7CTRVDHH2MN584SKXC6LXQC5S526TQE4VW2TFG6Y6VJS8PFRV4PS2U64JD6ZGVN82UM9WG7N2C33VCEKXVN995UXZDRY956XVDNZ95UK2VNR95MKGVTPXP3RXCE5V56KVGK8387",
              "network": "NETWORK_LIGHTNING",
            }
          allOf:
            - $ref: "#/components/schemas/DepositDestination"
          description: LNURL-pay code that accepts Lightning payments to the account.
    GetBitcoinWithdrawalResponse:
      type: object
      properties:
        withdrawalId:
          example: "wi_01JA2B3C4D5E6F7G8H9J0K1M2N"
          type: string
        destination:
          example: "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh"
          type: string
          description: The destination of the withdrawal.
        network:
          example: "NETWORK_BITCOIN"
